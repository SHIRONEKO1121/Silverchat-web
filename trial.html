<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>領取試用帳號 · SilverChat 愛耆易</title>
<style>
/* ── 沿用 silverchat-lake.vercel.app 嘅設計變數（奶油風）───────────── */
:root {
    --bg-color: #FBF3E3;
    --accent-color: #C48A12;
    --accent-bright: #F6B73C;
    --sun-deep: #E9A319;
    --sun-grad: linear-gradient(150deg, #F8C454, #F3AE24);
    --text-primary: #221B10;
    --text-secondary: #8A7C66;
    --radius: 22px;
    --card-bg: #FFFFFF;
    --card-shadow: 0 10px 24px -10px rgba(160,120,40,.1), 0 2px 6px -2px rgba(160,120,40,.06);
    --shadow-lg: 0 20px 50px rgba(160,120,40,.16);
    --ease: cubic-bezier(.23,1,.32,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg-color);
    color: var(--text-primary);
    font-family: -apple-system, "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", sans-serif;
    min-height: 100vh;
    padding: 32px 20px 60px;
    display: flex; flex-direction: column; align-items: center;
}
.wrap { width: 100%; max-width: 560px; }

/* ── 頁頭 ── */
header { text-align: center; margin-bottom: 30px; }
.logo {
    width: 76px; height: 76px; border-radius: 22px; margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    background: var(--sun-grad); box-shadow: var(--shadow-lg);
    font-size: 34px;
}
h1 { font-size: 1.85rem; font-weight: 800; letter-spacing: -.02em; }
.sub { margin-top: 10px; color: var(--text-secondary); font-size: 1rem; line-height: 1.65; }

/* ── 卡片 ── */
.card {
    background: var(--card-bg); border-radius: var(--radius);
    padding: 26px 22px; box-shadow: var(--card-shadow); margin-bottom: 18px;
}
.card-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 6px; }
.card-hint { color: var(--text-secondary); font-size: .95rem; margin-bottom: 18px; line-height: 1.6; }

/* ── 身份選擇（適老化：大卡、大字）── */
.roles { display: flex; flex-direction: column; gap: 12px; }
.role-btn {
    display: flex; align-items: center; gap: 14px;
    width: 100%; min-height: 88px; padding: 16px 18px;
    background: var(--card-bg); border: 3px solid rgba(160,120,40,.16);
    border-radius: 18px; cursor: pointer; text-align: left;
    font-family: inherit; font-size: 1.15rem; font-weight: 800; color: var(--text-primary);
    transition: transform .14s var(--ease), border-color .14s var(--ease), background .14s var(--ease);
    -webkit-tap-highlight-color: transparent;
}
.role-btn:active { transform: scale(.97); }
.role-btn[aria-pressed="true"] {
    border-color: var(--sun-deep); background: rgba(240,160,40,.12);
}
.role-emoji { font-size: 30px; flex: none; }
.role-text { display: flex; flex-direction: column; gap: 3px; }
.role-desc { font-size: .85rem; font-weight: 600; color: var(--text-secondary); }

/* ── 主按鈕 ── */
.btn-primary {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; min-height: 66px; margin-top: 20px;
    background: var(--sun-grad); color: #fff;
    border: none; border-radius: 18px; cursor: pointer;
    font-family: inherit; font-size: 1.15rem; font-weight: 800;
    box-shadow: 0 8px 20px -6px rgba(200,140,20,.5);
    transition: transform .14s var(--ease), opacity .14s;
}
.btn-primary:active { transform: scale(.97); }
.btn-primary:disabled { opacity: .55; cursor: not-allowed; }

/* ── 結果：帳號 / 密碼 ── */
.field { margin-bottom: 16px; }
.field-label {
    font-size: .9rem; font-weight: 700; color: var(--text-secondary);
    margin-bottom: 8px; display: block;
}
.field-row { display: flex; gap: 10px; align-items: stretch; }
.field-value {
    flex: 1; min-width: 0; min-height: 66px;
    display: flex; align-items: center; padding: 0 18px;
    background: #FFF9EC; border: 2px solid rgba(160,120,40,.18);
    border-radius: 16px;
    font-size: 1.3rem; font-weight: 800; letter-spacing: .04em;
    overflow-x: auto; white-space: nowrap;
}
.copy-btn {
    flex: none; width: 82px; min-height: 66px;
    background: var(--sun-deep); color: #fff;
    border: none; border-radius: 16px; cursor: pointer;
    font-family: inherit; font-size: .95rem; font-weight: 800;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    transition: transform .14s var(--ease), background .2s;
}
.copy-btn:active { transform: scale(.94); }
.copy-btn.copied { background: #3FA46F; }
.copy-btn svg { width: 20px; height: 20px; }

/* ── 提示 ── */
.notice {
    padding: 16px 18px; border-radius: 16px; font-size: .95rem; line-height: 1.65;
    margin-top: 16px;
}
.notice.info { background: rgba(240,160,40,.12); color: var(--text-primary); }
.notice.warn { background: rgba(241,85,69,.1); color: #A8322A; }
.notice.ok   { background: rgba(63,164,111,.12); color: #23714C; }

/* ── 剩餘數量 ── */
.stock { display: flex; gap: 10px; margin-top: 18px; }
.stock-item {
    flex: 1; text-align: center; padding: 14px 8px;
    background: #FFF9EC; border-radius: 14px;
}
.stock-n { font-size: 1.4rem; font-weight: 900; color: var(--sun-deep); }
.stock-l { font-size: .8rem; color: var(--text-secondary); margin-top: 3px; }

.hidden { display: none !important; }
.spinner {
    width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.4);
    border-top-color: #fff; border-radius: 50%;
    animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

footer { margin-top: 34px; text-align: center; font-size: .85rem; color: var(--text-muted); }
footer a { color: var(--accent-color); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <div class="logo">🎋</div>
        <h1>領取試用帳號</h1>
        <p class="sub">
            揀返你想登入嘅身份，我哋會即刻分配一個專屬試用帳號畀你。<br>
            每個帳號只會派一次，唔會同其他人重複。
        </p>
    </header>

    <!-- 步驟 1：揀身份 -->
    <section class="card" id="step-role">
        <div class="card-title">① 你想用邊個身份登入？</div>
        <p class="card-hint">撳一下揀定，撳「拎帳號」就會分配。</p>
        <div class="roles">
            <button type="button" class="role-btn" data-role="elderly" aria-pressed="false">
                <span class="role-emoji">🧓</span>
                <span class="role-text">
                    <span>長者</span>
                    <span class="role-desc">傾偈、記低回憶、食藥提醒</span>
                </span>
            </button>
            <button type="button" class="role-btn" data-role="family" aria-pressed="false">
                <span class="role-emoji">👨‍👩‍👧</span>
                <span class="role-text">
                    <span>家人</span>
                    <span class="role-desc">睇長者狀況、加日程、收警報</span>
                </span>
            </button>
            <button type="button" class="role-btn" data-role="social_worker" aria-pressed="false">
                <span class="role-emoji">🧑‍⚕️</span>
                <span class="role-text">
                    <span>社工</span>
                    <span class="role-desc">管理個案、處理求助警報</span>
                </span>
            </button>
        </div>
        <button type="button" class="btn-primary" id="claim-btn" disabled>
            拎帳號
        </button>
        <div class="notice info" id="cooldown-note">
            每位訪客 3 日內只可以拎 1 個帳號。
        </div>
    </section>

    <!-- 步驟 2：結果 -->
    <section class="card hidden" id="step-result">
        <div class="card-title">② 你嘅試用帳號</div>
        <p class="card-hint">撳右邊掣複製，返 App 登入撳貼上就得。</p>

        <div class="field">
            <span class="field-label">帳號</span>
            <div class="field-row">
                <div class="field-value" id="out-username">—</div>
                <button type="button" class="copy-btn" data-copy="out-username">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    <span>複製</span>
                </button>
            </div>
        </div>

        <div class="field">
            <span class="field-label">密碼</span>
            <div class="field-row">
                <div class="field-value" id="out-password">—</div>
                <button type="button" class="copy-btn" data-copy="out-password">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    <span>複製</span>
                </button>
            </div>
        </div>

        <div class="notice ok" id="result-note"></div>

        <div class="stock" id="stock"></div>
    </section>

    <footer>
        <a href="/">← 返 SilverChat 主頁</a><br>
        試用帳號由系統自動派發，僅供測試使用。
    </footer>
</div>

<script>
// ── 設定 ──────────────────────────────────────────────────────────────
// 後端就係而家 SilverChat 用緊嗰個（CloudBase 雲托管）
var API = 'https://silverchat-server-316201-12-1453732322.sh.run.tcloudbase.com/api/trial';

var VISITOR_KEY = null;
var SELECTED_ROLE = null;

// ── visitorKey：存 localStorage，用嚟做 3 日限領 ────────────────────────
function getVisitorKey() {
    try {
        var k = localStorage.getItem('sc_trial_vk');
        if (!k) {
            k = (crypto.randomUUID && crypto.randomUUID())
                || ('vk-' + Date.now() + '-' + Math.random().toString(36).slice(2, 12));
            localStorage.setItem('sc_trial_vk', k);
        }
        return k;
    } catch (e) {
        // 無痕模式 etc.：退化为每次新 key（限制會失效，但唔會壞）
        return 'vk-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
    }
}

// ── 複製 ───────────────────────────────────────────────────────────────
function copyText(text, btn) {
    function done() {
        if (!btn) return;
        var span = btn.querySelector('span');
        var old = span.textContent;
        btn.classList.add('copied');
        span.textContent = '已複製';
        setTimeout(function () {
            btn.classList.remove('copied');
            span.textContent = old;
        }, 1600);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () { fallback(text, done); });
    } else {
        fallback(text, done);
    }
}
function fallback(text, done) {
    // iOS Safari 舊版：用 hidden textarea + execCommand
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { alert('複製唔到，請手動抄低：' + text); }
    document.body.removeChild(ta);
}

// ── 身份選擇 ───────────────────────────────────────────────────────────
var roleBtns = document.querySelectorAll('.role-btn');
roleBtns.forEach(function (b) {
    b.addEventListener('click', function () {
        roleBtns.forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        b.setAttribute('aria-pressed', 'true');
        SELECTED_ROLE = b.dataset.role;
        document.getElementById('claim-btn').disabled = false;
    });
});

// ── 拎帳號 ─────────────────────────────────────────────────────────────
var claimBtn = document.getElementById('claim-btn');
claimBtn.addEventListener('click', function () {
    if (!SELECTED_ROLE) return;
    claimBtn.disabled = true;
    claimBtn.innerHTML = '<span class="spinner"></span> 分配緊…';

    fetch(API + '/claim', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ visitorKey: VISITOR_KEY, role: SELECTED_ROLE })
    })
    .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
    .then(function (res) {
        if (res.status === 200 && res.body && res.body.success) {
            showResult(res.body.account);
        } else {
            // 429 = 3 日內拎過 → 顯示返上次嗰個
            if (res.status === 429) {
                loadMine();
            } else {
                var note = document.getElementById('cooldown-note');
                note.className = 'notice warn';
                note.textContent = (res.body && res.body.message) || '分配失敗，請稍後再試';
                claimBtn.disabled = false;
                claimBtn.textContent = '再試一次';
            }
        }
    })
    .catch(function (e) {
        var note = document.getElementById('cooldown-note');
        note.className = 'notice warn';
        note.textContent = '連唔到伺服器，請檢查網絡再試（' + e.message + '）';
        claimBtn.disabled = false;
        claimBtn.textContent = '再試一次';
    });
});

// ── 顯示結果 ───────────────────────────────────────────────────────────
function showResult(acc) {
    document.getElementById('step-role').classList.add('hidden');
    var panel = document.getElementById('step-result');
    panel.classList.remove('hidden');
    document.getElementById('out-username').textContent = acc.username;
    document.getElementById('out-password').textContent = acc.password;
    document.getElementById('result-note').textContent =
        '呢個係「' + (acc.roleLabel || acc.role) + '」試用帳號，已經派咗畀你，其他人唔會再拎到同一個。';
    loadStats();
}

// ── 拎過就顯示返（重新打開網頁）────────────────────────────────────────
function loadMine() {
    fetch(API + '/mine?visitorKey=' + encodeURIComponent(VISITOR_KEY))
    .then(function (r) { return r.json(); })
    .then(function (j) {
        if (j && j.success && j.claimed && j.account) {
            showResult(j.account);
            if (j.waitMs > 0) {
                var d = (j.waitMs / (24 * 60 * 60 * 1000)).toFixed(1);
                document.getElementById('result-note').textContent =
                    '你之前已經拎過呢個帳號，' + d + ' 日後可以先再拎第二個。';
            }
        }
    })
    .catch(function () { /* 冇拎過就唔使理 */ });
}

// ── 剩餘數量 ───────────────────────────────────────────────────────────
function loadStats() {
    fetch(API + '/stats')
    .then(function (r) { return r.json(); })
    .then(function (j) {
        if (!j || !j.success || !j.stats) return;
        var labels = { elderly: '長者', family: '家人', social_worker: '社工' };
        var html = '';
        Object.keys(labels).forEach(function (k) {
            var s = j.stats[k];
            if (!s) return;
            html += '<div class="stock-item"><div class="stock-n">' + s.left +
                    '</div><div class="stock-l">' + labels[k] + '剩餘</div></div>';
        });
        document.getElementById('stock').innerHTML = html;
    })
    .catch(function () { });
}

// ── 綁定複製掣 ────────────────────────────────────────────────────────
document.querySelectorAll('.copy-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
        var el = document.getElementById(btn.dataset.copy);
        if (el) copyText(el.textContent.trim(), btn);
    });
});

// ── 開波 ───────────────────────────────────────────────────────────────
VISITOR_KEY = getVisitorKey();
loadStats();
loadMine();   // 已經拎過就直接顯示返
</script>
</body>
</html>
